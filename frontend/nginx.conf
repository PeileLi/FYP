server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Handle root path (redirect to /FYP/)
    location = / {
        return 301 $scheme://$http_host/FYP/;
    }

    # Handle /FYP path without trailing slash
    location = /FYP {
        return 301 $scheme://$http_host/FYP/;
    }

    # Handle /FYP/ and all sub-paths
    location /FYP/ {
        alias /usr/share/nginx/html/;
        
        # Cache static assets
        location ~* ^/FYP/(.+\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot))$ {
            alias /usr/share/nginx/html/$1;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        # SPA fallback - serve index.html for all other routes
        try_files $uri $uri/ /FYP/index.html;
    }

    # Handle /FYP/index.html specifically (no cache)
    location = /FYP/index.html {
        alias /usr/share/nginx/html/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}
