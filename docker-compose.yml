services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fyp-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://aws-1-eu-west-1.pooler.supabase.com:6543/postgres?sslmode=require
      SPRING_DATASOURCE_USERNAME: postgres.jxqrdqnfwqukunugydxd
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-to-a-long-random-string-at-least-32-bytes}
    restart: unless-stopped
    networks:
      - fyp-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fyp-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - fyp-network

networks:
  fyp-network:
    driver: bridge
