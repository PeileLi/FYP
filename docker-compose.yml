services:
  postgres:
    image: postgres:15-alpine
    container_name: fyp-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fyp_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - fyp-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fyp-backend
    ports:
      - "8080:8080"
    environment:
      # Database configuration - defaults to local DB, override with .env file for Supabase
      # For local DB: jdbc:postgresql://postgres:5432/fyp_db
      # For Supabase: Set SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD in .env
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/fyp_db}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-to-a-long-random-string-at-least-32-bytes}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_BUCKET_NAME: ${SUPABASE_BUCKET_NAME:-campaign-images}
      SUPABASE_STORAGE_ENABLED: ${SUPABASE_STORAGE_ENABLED:-true}
      # Fabric configuration
      FABRIC_ENABLED: ${FABRIC_ENABLED:-true}
      FABRIC_CHANNEL_NAME: ${FABRIC_CHANNEL_NAME:-mychannel}
      FABRIC_CHAINCODE_NAME: ${FABRIC_CHAINCODE_NAME:-donation}
      FABRIC_MSP_ID: ${FABRIC_MSP_ID:-Org1MSP}
      FABRIC_PEER_ENDPOINT: ${FABRIC_PEER_ENDPOINT:-peer0.org1.example.com:7051}
      FABRIC_PEER_HOST_ALIAS: ${FABRIC_PEER_HOST_ALIAS:-peer0.org1.example.com}
      # Use paths inside container (mounted volumes)
      FABRIC_CERT_PATH: ${FABRIC_CERT_PATH:-/fabric/organizations/peerOrganizations/org1.example.com/users/Admin@org1.example.com/msp/signcerts/cert.pem}
      FABRIC_KEY_PATH: ${FABRIC_KEY_PATH:-/fabric/organizations/peerOrganizations/org1.example.com/users/Admin@org1.example.com/msp/keystore}
      FABRIC_TLS_CERT_PATH: ${FABRIC_TLS_CERT_PATH:-/fabric/organizations/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/tls/ca.crt}
    volumes:
      # Persist uploaded images
      - campaign_images:/app/uploads/images
      # Mount Fabric crypto materials (read-only)
      # Using absolute paths from actual Fabric network location
      - /home/li/project/FYP/fabric/fabric-samples/test-network/organizations/peerOrganizations/org1.example.com:/fabric/organizations/peerOrganizations/org1.example.com:ro
      - /home/li/project/FYP/fabric/fabric-samples/test-network/organizations/ordererOrganizations/example.com:/fabric/organizations/ordererOrganizations/example.com:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - fyp-network
      - fabric_test

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fyp-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - fyp-network

networks:
  fyp-network:
    driver: bridge
  fabric_test:
    external: true
    name: fabric_test

volumes:
  postgres_data:
  campaign_images:
