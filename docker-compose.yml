version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: fyp-postgres
    environment:
      POSTGRES_DB: fyp_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

volumes:
  pgdata:
