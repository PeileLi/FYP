spring:
  application:
    name: fyp-backend

  datasource:
    # PostgreSQL Database Configuration
    # For local development: jdbc:postgresql://localhost:5432/fyp_db
    # For Supabase: jdbc:postgresql://db.<your-project-ref>.supabase.co:5432/postgres
    # Configure in .env file (see .env.example for details)
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fyp_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 30000
      max-lifetime: 1800000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update  
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # File upload configuration
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080

file:
  upload-dir: uploads/images

jwt:
  secret: ${JWT_SECRET:my-secret-key-for-jwt-token-generation-change-this-in-production}
  expiration: 86400000

# Supabase Storage Configuration
supabase:
  url: ${SUPABASE_URL:https://your-project.supabase.co}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:your-service-role-key}
  storage:
    enabled: ${SUPABASE_STORAGE_ENABLED:true}
    bucket-name: ${SUPABASE_BUCKET_NAME:campaign-images}

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace

# Hyperledger Fabric Configuration
fabric:
  enabled: ${FABRIC_ENABLED:true}
  channel-name: ${FABRIC_CHANNEL_NAME:mychannel}
  chaincode-name: ${FABRIC_CHAINCODE_NAME:donation}
  msp-id: ${FABRIC_MSP_ID:Org1MSP}
  peer-endpoint: ${FABRIC_PEER_ENDPOINT:localhost:7051}
  peer-host-alias: ${FABRIC_PEER_HOST_ALIAS:peer0.org1.example.com}
  # Default certificate paths for Fabric test-network (can be overridden by environment variables)
  cert-path: ${FABRIC_CERT_PATH:/home/li/project/FYP/fabric/fabric-samples/test-network/organizations/peerOrganizations/org1.example.com/users/Admin@org1.example.com/msp/signcerts/cert.pem}
  key-path: ${FABRIC_KEY_PATH:/home/li/project/FYP/fabric/fabric-samples/test-network/organizations/peerOrganizations/org1.example.com/users/Admin@org1.example.com/msp/keystore}
  tls-cert-path: ${FABRIC_TLS_CERT_PATH:/home/li/project/FYP/fabric/fabric-samples/test-network/organizations/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/tls/tlscacerts/tls-localhost-7054-ca-org1.pem}
