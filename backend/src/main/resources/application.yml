spring:
  application:
    name: fyp-backend

  datasource:
    # Supabase PostgreSQL (Pooler connection for IPv4 support)
    # prepareThreshold=0 disables prepared statements (required for PgBouncer/Supabase Pooler)
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-1-eu-west-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0}
    username: ${SPRING_DATASOURCE_USERNAME:postgres.jxqrdqnfwqukunugydxd}
    password: ${SPRING_DATASOURCE_PASSWORD:CHANGE_ME}

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 30000
      max-lifetime: 1800000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update  
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

# File upload configuration
spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

file:
  upload-dir: uploads/images

jwt:
  secret: ${JWT_SECRET:change-this-secret-to-a-long-random-string-at-least-32-bytes}
  expiration: 86400000

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace
